# ---
# relationships:
#   verifies: mcp-external-registration
#   uses:
#     - .github/fork/check-allowlist.sh
#     - .github/fork/test.sh
#     - .github/fork/verify-upstream-base-pin.sh
# ---
name: Fork server CI

on:
  push:
    branches:
      - mcp-external-registration
  pull_request:
    branches:
      - mcp-external-registration

permissions:
  contents: read

concurrency:
  group: fork-server-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify server fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check fork boundary
        run: .github/fork/check-allowlist.sh

      - name: Verify upstream base pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="$(.github/fork/read-upstream-version.sh .github/fork/upstream-version)"
          .github/fork/verify-upstream-base-pin.sh "$version" .github/fork/base-tag

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Test fork tooling
        run: .github/fork/test.sh

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test server
        run: vp run --filter t3 test

      - name: Build server
        run: vp run --filter t3 build
