# ---
# relationships:
#   builds: docker/t3code-web/Dockerfile
#   verifies: docker/t3code-web/nginx.conf
# ---
name: Fork web image CI

on:
  pull_request:
    branches:
      - web-image
  push:
    branches:
      - web-image

permissions:
  contents: read

concurrency:
  group: fork-web-image-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T3CODE_BASE_TAG: v0.0.37
      T3CODE_BASE_COMMIT: cefec32d6fc5d14f03e110ebdde534bdbcc9b62b
      T3CODE_RELEASE_VERSION: 0.0.37-wyrd.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify additive fork boundary
        run: |
          set -euo pipefail
          git cat-file -e "${T3CODE_BASE_COMMIT}^{commit}"
          test "$(git rev-parse "${T3CODE_BASE_TAG}^{commit}")" = "$T3CODE_BASE_COMMIT"

          violations="$(
            git diff --name-status "${T3CODE_BASE_COMMIT}...HEAD" |
              awk '$1 != "A" || ($2 !~ /^docker\/t3code-web\// && $2 !~ /^\.github\/workflows\/fork-web-image-(ci|cd)\.yml$/)'
          )"
          if [ -n "$violations" ]; then
            printf 'Web image branch must contain only approved added files:\n%s\n' "$violations" >&2
            exit 1
          fi

          grep --fixed-strings --quiet "$T3CODE_BASE_TAG" docker/t3code-web/README.md
          grep --fixed-strings --quiet "$T3CODE_BASE_COMMIT" docker/t3code-web/README.md
          grep --fixed-strings --quiet "web/${T3CODE_RELEASE_VERSION}" docker/t3code-web/README.md
          workspace_vite_plus="$(awk '$1 == "vite-plus:" { print $2; exit }' pnpm-workspace.yaml)"
          docker_vite_plus="$(sed -n 's/^ARG VITE_PLUS_VERSION=//p' docker/t3code-web/Dockerfile)"
          test -n "$workspace_vite_plus"
          test "$docker_vite_plus" = "$workspace_vite_plus"
          if grep -E 'T3CODE_SOURCE_SHA256|t3code/archive|sha256sum' docker/t3code-web/Dockerfile; then
            echo 'Dockerfile must build the checked-out tree without a downloaded source archive.' >&2
            exit 1
          fi

      - name: Verify CD public pull contract
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          workflow = Path(".github/workflows/fork-web-image-cd.yml").read_text()
          failures = []

          def check(name, condition, detail):
              if condition:
                  print(f"PASS: {name}")
              else:
                  failures.append(name)
                  print(f"FAIL: {name}: {detail}", file=sys.stderr)

          def job(name):
              match = re.search(
                  rf"(?ms)^  {re.escape(name)}:\n(?P<body>.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)",
                  workflow,
              )
              return match.group("body") if match else None

          forbidden_visibility_patterns = (
              r"(?i)make image public",
              r"(?i)/(?:orgs|users)/[^\s]+/packages/",
              r"(?i)\bvisibility\s*=\s*public\b",
              r"(?i)\bpackage[-_ ]?(?:admin|visibility)\b",
          )
          check(
              "test_package_visibility_mutation_absent",
              not any(re.search(pattern, workflow) for pattern in forbidden_visibility_patterns),
              "CD must not mutate package visibility or require package administration",
          )

          publish = job("publish")
          check(
              "test_publish_image_name",
              publish is not None
              and "image=ghcr.io/wyrd-company/t3code-web" in publish,
              "publish must produce ghcr.io/wyrd-company/t3code-web",
          )
          if publish is not None:
              permissions_match = re.search(
                  r"(?m)^    permissions:\n(?P<body>(?:^      [A-Za-z-]+: [A-Za-z]+\n)+)",
                  publish,
              )
              permissions = (
                  dict(
                      re.findall(
                          r"(?m)^      ([A-Za-z-]+): ([A-Za-z]+)$",
                          permissions_match.group("body"),
                      )
                  )
                  if permissions_match
                  else {}
              )
              check(
                  "test_publish_permissions_are_least_privilege",
                  permissions
                  == {
                      "contents": "read",
                      "packages": "write",
                      "attestations": "write",
                      "id-token": "write",
                  },
                  "publish permissions must be limited to checkout, push, and attestation",
              )

              def publish_env(name):
                  match = re.search(rf"(?m)^      {name}: (?P<value>\S+)\s*$", publish)
                  return match.group("value") if match else None

              base_tag = publish_env("T3CODE_BASE_TAG")
              base_commit = publish_env("T3CODE_BASE_COMMIT")
              release_version = publish_env("T3CODE_RELEASE_VERSION")
              check(
                  "test_release_identity_is_distinct_from_upstream_base",
                  base_tag is not None
                  and base_tag.startswith("v")
                  and release_version is not None
                  and release_version != base_tag.removeprefix("v"),
                  "fork release version must differ from the upstream base tag",
              )
              readme = Path("docker/t3code-web/README.md").read_text()
              identity_guards = (
                  '"$RELEASE_VERSION" != "$T3CODE_RELEASE_VERSION"',
                  'git rev-parse "${T3CODE_BASE_TAG}^{commit}"',
                  'grep --fixed-strings --quiet "$T3CODE_BASE_TAG"',
                  'grep --fixed-strings --quiet "$T3CODE_BASE_COMMIT"',
                  'grep --fixed-strings --quiet "web/${T3CODE_RELEASE_VERSION}"',
              )
              check(
                  "test_release_identity_guards_and_docs_agree",
                  base_tag is not None
                  and base_commit is not None
                  and release_version is not None
                  and base_tag in readme
                  and base_commit in readme
                  and f"web/{release_version}" in readme
                  and all(guard in publish for guard in identity_guards),
                  "base and fork release identities must remain guarded and documented",
              )

          anonymous = job("anonymous-arm64-smoke")
          check(
              "test_anonymous_proof_job_exists",
              anonymous is not None,
              "anonymous-arm64-smoke job is required",
          )
          if anonymous is not None:
              check(
                  "test_anonymous_proof_needs_publish",
                  re.search(r"(?m)^    needs: publish\s*$", anonymous) is not None,
                  "anonymous proof must depend on publish",
              )
              check(
                  "test_anonymous_proof_has_no_permissions",
                  re.search(r"(?m)^    permissions: \{\}\s*$", anonymous) is not None
                  and re.search(r"(?m)^\s+(?:packages|contents):", anonymous) is None,
                  "anonymous proof must have no package or contents permission",
              )
              credential_patterns = (
                  r"\$\{\{\s*secrets\.",
                  r"\$\{\{\s*github\.token",
                  r"(?m)^\s+(?:GH_TOKEN|GITHUB_TOKEN):",
                  r"(?m)^\s+token:",
              )
              check(
                  "test_anonymous_proof_has_no_credentials",
                  not any(re.search(pattern, anonymous) for pattern in credential_patterns),
                  "anonymous proof must not receive a token or secret",
              )
              login_patterns = (
                  r"docker/login-action",
                  r"(?m)^\s*docker\s+login\b",
                  r"(?m)^\s*(?:oras|skopeo)\s+login\b",
              )
              check(
                  "test_anonymous_proof_has_no_registry_login",
                  not any(re.search(pattern, anonymous, re.IGNORECASE) for pattern in login_patterns),
                  "anonymous proof must not log in to a registry",
              )
              runner_temp = "$" + "{{ runner.temp }}/anonymous-docker-config"
              check(
                  "test_anonymous_proof_uses_isolated_docker_config",
                  anonymous.count("DOCKER_CONFIG: " + runner_temp) == 2
                  and 'mkdir -p "$DOCKER_CONFIG"' in anonymous
                  and "printf '{\"auths\":{}}\\n' > \"$DOCKER_CONFIG/config.json\"" in anonymous
                  and re.search(r"(?i)credsStore|credHelpers", anonymous) is None,
                  "anonymous proof must use an empty Docker config without credential helpers",
              )
              expression = "$" + "{{"
              published_image = (
                  "IMAGE: "
                  + expression
                  + " needs.publish.outputs.image }}:"
                  + expression
                  + " needs.publish.outputs.version }}"
              )
              check(
                  "test_anonymous_proof_pulls_published_image",
                  published_image in anonymous
                  and 'docker pull --platform linux/arm64 "$IMAGE"' in anonymous,
                  "anonymous proof must pull the image and version produced by publish",
              )
              runtime_proof = (
                  'docker run --detach --name "$name" --platform linux/arm64 "$IMAGE"',
                  "test \"$(docker inspect --format '{{.State.Health.Status}}' \"$name\")\" = healthy",
                  'docker exec "$name" test -f /usr/share/licenses/t3code/LICENSE',
                  'wget -q -O - http://127.0.0.1/',
                  'wget -q -O - http://127.0.0.1/pair',
              )
              check(
                  "test_anonymous_proof_requires_runtime_success",
                  "set -euo pipefail" in anonymous
                  and "continue-on-error" not in anonymous
                  and all(proof in anonymous for proof in runtime_proof),
                  "anonymous proof must fail on pull, health, license, or HTTP runtime failure",
              )

          if failures:
              sys.exit(1)
          PY

      - name: Build image
        run: |
          docker build \
            --build-arg T3CODE_VERSION="$T3CODE_RELEASE_VERSION" \
            --tag t3code-web-ci:${{ github.sha }} \
            --file docker/t3code-web/Dockerfile \
            .

      - name: Smoke test image
        env:
          IMAGE: t3code-web-ci:${{ github.sha }}
          T3CODE_VERSION: ${{ env.T3CODE_RELEASE_VERSION }}
        run: |
          set -euo pipefail
          name="t3code-web-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$name" "$IMAGE" >/dev/null

          for _ in $(seq 1 30); do
            if docker exec "$name" wget -q -O /dev/null http://127.0.0.1/; then
              break
            fi
            sleep 1
          done

          index="$(docker exec "$name" wget -q -O - http://127.0.0.1/)"
          pair="$(docker exec "$name" wget -q -O - http://127.0.0.1/pair)"
          grep -q '<div id="root">' <<<"$index"
          grep -q '<div id="root">' <<<"$pair"
          docker exec "$name" test -f /usr/share/licenses/t3code/LICENSE
          docker exec "$name" sh -c '! command -v node >/dev/null 2>&1 && ! command -v t3 >/dev/null 2>&1'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.description"}}' "$name")" = 'Unmodified static T3 Code web client'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.url"}}' "$name")" = 'https://github.com/pingdotgg/t3code'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$name")" = "$T3CODE_VERSION"

          for _ in $(seq 1 10); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name")"
            [ "$health" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy
